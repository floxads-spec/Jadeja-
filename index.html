  <style>
    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: #050507;
    }

    body {
      overflow-x: hidden;
    }

    .ewj-page,
    .ewj-page * {
      box-sizing: border-box;
    }

    .ewj-page {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100vh;
      min-height: 100svh;
      padding: 35px 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      overflow-y: auto;
      color: #fff;
      background:
        radial-gradient(circle at 15% 20%, rgba(226, 0, 27, .35), transparent 34%),
        radial-gradient(circle at 85% 75%, rgba(0, 99, 255, .30), transparent 36%),
        linear-gradient(135deg, #050507 0%, #10030a 45%, #020916 100%);
      font-family: 'Poppins', Arial, sans-serif;
      line-height: 1.5;
    }

    .ewj-light,
    .ewj-grid,
    .ewj-particle {
      position: absolute;
      pointer-events: none;
      z-index: -1;
    }

    .ewj-light {
      width: 420px;
      height: 420px;
      border-radius: 50%;
      filter: blur(80px);
      opacity: .32;
      animation: ewj-move-light 10s ease-in-out infinite alternate;
    }

    .ewj-light--red {
      top: -180px;
      left: -130px;
      background: #ff001e;
    }

    .ewj-light--blue {
      right: -160px;
      bottom: -180px;
      background: #006eff;
      animation-delay: -4s;
    }

    .ewj-grid {
      inset: -50%;
      width: 200%;
      height: 200%;
      opacity: .15;
      background-image:
        linear-gradient(rgba(255, 255, 255, .14) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, .14) 1px, transparent 1px);
      background-size: 55px 55px;
      transform: perspective(500px) rotateX(55deg);
      animation: ewj-move-grid 12s linear infinite;
    }

    .ewj-particle {
      bottom: -20px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #fff;
      box-shadow: 0 0 16px #fff;
      opacity: 0;
      animation: ewj-float-particle 7s linear infinite;
    }

    .ewj-particle--1 {
      left: 12%;
    }

    .ewj-particle--2 {
      left: 30%;
      animation-delay: 2s;
    }

    .ewj-particle--3 {
      left: 68%;
      animation-delay: 4s;
    }

    .ewj-particle--4 {
      left: 88%;
      animation-delay: 1s;
    }

    .ewj-content {
      position: relative;
      z-index: 2;
      width: 100%;
      max-width: 720px;
      margin: auto;
      text-align: center;
      animation: ewj-content-entry .9s ease-out both;
    }

    .ewj-logo {
      position: relative;
      width: 138px;
      height: 138px;
      margin: 0 auto 27px;
      padding: 5px;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 4px solid rgba(255, 255, 255, .92);
      border-radius: 50%;
      background: linear-gradient(145deg, #f90027, #005bd7);
      box-shadow:
        0 0 0 9px rgba(226, 0, 27, .16),
        0 0 48px rgba(255, 0, 38, .6);
      animation: ewj-logo-float 3s ease-in-out infinite;
    }

    .ewj-logo::after {
      content: "";
      position: absolute;
      inset: -13px;
      border: 1px solid rgba(255, 255, 255, .25);
      border-radius: 50%;
      animation: ewj-logo-pulse 2s ease-out infinite;
    }

    .ewj-logo img {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      object-position: center top;
      border-radius: 50%;
      background: #111;
    }

    .ewj-online-dot {
      position: absolute;
      z-index: 4;
      right: 7px;
      bottom: 9px;
      width: 20px;
      height: 20px;
      border: 4px solid #10030a;
      border-radius: 50%;
      background: #55f29a;
      box-shadow: 0 0 14px #55f29a;
    }

    .ewj-label {
      margin-bottom: 17px;
      padding: 8px 17px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(255, 255, 255, .22);
      border-radius: 999px;
      background: rgba(255, 255, 255, .07);
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .ewj-label-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff1238;
      box-shadow: 0 0 12px #ff1238;
      animation: ewj-blink 1.2s ease-in-out infinite;
    }

    .ewj-title {
      margin: 0;
      color: #fff;
      font-size: clamp(42px, 8vw, 80px);
      line-height: 1.03;
      font-weight: 900;
      letter-spacing: -3px;
      text-transform: uppercase;
      text-shadow: 0 7px 30px rgba(0, 0, 0, .55);
    }

    .ewj-title span {
      display: block;
      color: transparent;
      background: linear-gradient(90deg, #ff163c, #fff 48%, #1681ff);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .ewj-description {
      max-width: 570px;
      margin: 19px auto 30px;
      color: rgba(255, 255, 255, .76);
      font-size: 16px;
      line-height: 1.7;
    }

    .ewj-telegram-btn {
      position: relative;
      min-width: 250px;
      padding: 17px 29px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 11px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, .7);
      border-radius: 999px;
      color: #fff;
      background: linear-gradient(90deg, #e80024, #b5003e, #005fd3);
      box-shadow:
        0 12px 35px rgba(224, 0, 33, .38),
        inset 0 1px rgba(255, 255, 255, .3);
      text-decoration: none;
      text-transform: uppercase;
      font-size: 14px;
      font-weight: 700;
      letter-spacing: .7px;
      transition: transform .3s ease, box-shadow .3s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .ewj-telegram-btn::before {
      content: "";
      position: absolute;
      top: 0;
      left: -120%;
      width: 60%;
      height: 100%;
      transform: skewX(-25deg);
      background: linear-gradient(
        90deg,
        transparent,
        rgba(255, 255, 255, .45),
        transparent
      );
      animation: ewj-button-shine 3s ease-in-out infinite;
    }

    .ewj-telegram-btn:hover,
    .ewj-telegram-btn:focus-visible {
      transform: translateY(-4px) scale(1.03);
      box-shadow:
        0 18px 45px rgba(224, 0, 33, .55),
        0 0 25px rgba(0, 110, 255, .23);
      outline: none;
    }

    .ewj-telegram-btn:active {
      transform: scale(.97);
    }

    .ewj-telegram-btn svg,
    .ewj-telegram-btn span {
      position: relative;
      z-index: 2;
    }

    .ewj-telegram-btn svg {
      width: 22px;
      height: 22px;
      flex: 0 0 auto;
    }

    .ewj-brand {
      margin-top: 55px;
      color: rgba(255, 255, 255, .5);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .ewj-brand strong {
      color: #fff;
      font-weight: 700;
    }

    @keyframes ewj-move-light {
      from {
        transform: translate(0, 0) scale(1);
      }
      to {
        transform: translate(70px, 55px) scale(1.25);
      }
    }

    @keyframes ewj-move-grid {
      from {
        background-position: 0 0;
      }
      to {
        background-position: 0 110px;
      }
    }

    @keyframes ewj-float-particle {
      0% {
        transform: translateY(0) scale(.4);
        opacity: 0;
      }
      20% {
        opacity: .7;
      }
      100% {
        transform: translateY(-110vh) scale(1.3);
        opacity: 0;
      }
    }

    @keyframes ewj-content-entry {
      from {
        opacity: 0;
        transform: translateY(25px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes ewj-logo-float {
      0%,
      100% {
        transform: translateY(0);
      }
      50% {
        transform: translateY(-9px);
      }
    }

    @keyframes ewj-logo-pulse {
      from {
        transform: scale(.9);
        opacity: .8;
      }
      to {
        transform: scale(1.18);
        opacity: 0;
      }
    }

    @keyframes ewj-blink {
      50% {
        opacity: .35;
      }
    }

    @keyframes ewj-button-shine {
      0%,
      35% {
        left: -120%;
      }
      70%,
      100% {
        left: 150%;
      }
    }

    @media (max-width: 600px) {
      .ewj-page {
        padding: 28px 16px;
      }

      .ewj-logo {
        width: 112px;
        height: 112px;
        margin-bottom: 23px;
      }

      .ewj-label {
        margin-bottom: 15px;
        padding: 7px 13px;
        font-size: 10px;
        letter-spacing: 1.1px;
      }

      .ewj-title {
        font-size: clamp(38px, 13vw, 58px);
        line-height: 1.02;
        letter-spacing: -2px;
      }

      .ewj-description {
        margin: 16px auto 25px;
        font-size: 14px;
        line-height: 1.65;
      }

      .ewj-telegram-btn {
        width: 100%;
        max-width: 320px;
        min-width: 0;
        padding: 16px 22px;
        font-size: 13px;
      }

      .ewj-brand {
        margin-top: 43px;
      }

      .ewj-grid {
        background-size: 42px 42px;
      }
    }

    @media (max-height: 650px) {
      .ewj-page {
        align-items: flex-start;
        padding-top: 16px;
        padding-bottom: 16px;
      }

      .ewj-logo {
        width: 96px;
        height: 96px;
        margin-bottom: 17px;
      }

      .ewj-description {
        margin-top: 13px;
        margin-bottom: 20px;
      }

      .ewj-brand {
        margin-top: 28px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .ewj-page *,
      .ewj-page *::before,
      .ewj-page *::after {
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
      }
    }
  </style>
</head>
