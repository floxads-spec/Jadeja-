  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}

    html,body{
      width:100%;
      min-height:100%;
      font-family:'Poppins',sans-serif;
      background:#050507;
    }

    body{overflow-x:hidden}

    .jandeja-page{
      position:relative;
      width:100%;
      min-height:100svh;
      padding:35px 20px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      color:#fff;
      background:
        radial-gradient(circle at 15% 20%,rgba(226,0,27,.35),transparent 34%),
        radial-gradient(circle at 85% 75%,rgba(0,99,255,.30),transparent 36%),
        linear-gradient(135deg,#050507 0%,#10030a 45%,#020916 100%);
    }

    .live-light{
      position:absolute;
      width:420px;
      height:420px;
      border-radius:50%;
      filter:blur(80px);
      opacity:.32;
      pointer-events:none;
      animation:moveLight 10s ease-in-out infinite alternate;
    }

    .live-light.red{top:-180px;left:-130px;background:#ff001e}
    .live-light.blue{right:-160px;bottom:-180px;background:#006eff;animation-delay:-4s}

    .grid{
      position:absolute;
      inset:-50%;
      width:200%;
      height:200%;
      opacity:.15;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(255,255,255,.14) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.14) 1px,transparent 1px);
      background-size:55px 55px;
      transform:perspective(500px) rotateX(55deg);
      animation:moveGrid 12s linear infinite;
    }

    .particle{
      position:absolute;
      bottom:-20px;
      width:6px;
      height:6px;
      border-radius:50%;
      background:#fff;
      box-shadow:0 0 16px #fff;
      opacity:0;
      animation:floatParticle 7s linear infinite;
    }

    .p1{left:12%}.p2{left:30%;animation-delay:2s}
    .p3{left:68%;animation-delay:4s}.p4{left:88%;animation-delay:1s}

    .content{
      position:relative;
      z-index:5;
      width:100%;
      max-width:720px;
      text-align:center;
      animation:contentEntry .9s ease-out both;
    }

    .logo{
      position:relative;
      width:138px;
      height:138px;
      margin:0 auto 27px;
      padding:5px;
      display:flex;
      align-items:center;
      justify-content:center;
      border:4px solid rgba(255,255,255,.92);
      border-radius:50%;
      background:linear-gradient(145deg,#f90027,#005bd7);
      box-shadow:
        0 0 0 9px rgba(226,0,27,.16),
        0 0 48px rgba(255,0,38,.6);
      animation:logoFloat 3s ease-in-out infinite;
    }

    .logo::after{
      content:"";
      position:absolute;
      inset:-13px;
      border:1px solid rgba(255,255,255,.25);
      border-radius:50%;
      animation:logoPulse 2s ease-out infinite;
    }

    .logo img{
      position:relative;
      z-index:2;
      width:100%;
      height:100%;
      display:block;
      object-fit:cover;
      object-position:center top;
      border-radius:50%;
      background:#111;
    }

    .online-dot{
      position:absolute;
      z-index:4;
      right:7px;
      bottom:9px;
      width:20px;
      height:20px;
      border:4px solid #10030a;
      border-radius:50%;
      background:#55f29a;
      box-shadow:0 0 14px #55f29a;
    }

    .label{
      margin-bottom:17px;
      padding:8px 17px;
      display:inline-flex;
      align-items:center;
      gap:8px;
      border:1px solid rgba(255,255,255,.22);
      border-radius:999px;
      background:rgba(255,255,255,.07);
      backdrop-filter:blur(8px);
      font-size:12px;
      font-weight:600;
      letter-spacing:1.5px;
      text-transform:uppercase;
    }

    .label-dot{
      width:8px;
      height:8px;
      border-radius:50%;
      background:#ff1238;
      box-shadow:0 0 12px #ff1238;
      animation:blink 1.2s ease-in-out infinite;
    }

    h1{
      margin:0;
      font-size:clamp(42px,8vw,80px);
      line-height:1.03;
      font-weight:900;
      letter-spacing:-3px;
      text-transform:uppercase;
      text-shadow:0 7px 30px rgba(0,0,0,.55);
    }

    h1 span{
      display:block;
      color:transparent;
      background:linear-gradient(90deg,#ff163c,#fff 48%,#1681ff);
      background-clip:text;
      -webkit-background-clip:text;
    }

    .description{
      max-width:570px;
      margin:19px auto 30px;
      color:rgba(255,255,255,.76);
      font-size:16px;
      line-height:1.7;
    }

    .telegram-btn{
      position:relative;
      min-width:250px;
      padding:17px 29px;
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:11px;
      overflow:hidden;
      border:1px solid rgba(255,255,255,.7);
      border-radius:999px;
      color:#fff;
      background:linear-gradient(90deg,#e80024,#b5003e,#005fd3);
      box-shadow:
        0 12px 35px rgba(224,0,33,.38),
        inset 0 1px rgba(255,255,255,.3);
      text-decoration:none;
      text-transform:uppercase;
      font-size:14px;
      font-weight:700;
      letter-spacing:.7px;
      transition:transform .3s ease,box-shadow .3s ease;
    }

    .telegram-btn::before{
      content:"";
      position:absolute;
      top:0;
      left:-120%;
      width:60%;
      height:100%;
      transform:skewX(-25deg);
      background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);
      animation:buttonShine 3s ease-in-out infinite;
    }

    .telegram-btn:hover{
      transform:translateY(-4px) scale(1.03);
      box-shadow:
        0 18px 45px rgba(224,0,33,.55),
        0 0 25px rgba(0,110,255,.23);
    }

    .telegram-btn:active{transform:scale(.97)}
    .telegram-btn svg,.telegram-btn span{position:relative;z-index:2}
    .telegram-btn svg{width:22px;height:22px}

    .brand{
      margin-top:55px;
      color:rgba(255,255,255,.5);
      font-size:11px;
      font-weight:600;
      letter-spacing:3px;
      text-transform:uppercase;
    }

    .brand strong{color:#fff;font-weight:700}

    @keyframes moveLight{
      from{transform:translate(0,0) scale(1)}
      to{transform:translate(70px,55px) scale(1.25)}
    }

    @keyframes moveGrid{
      from{background-position:0 0}
      to{background-position:0 110px}
    }

    @keyframes floatParticle{
      0%{transform:translateY(0) scale(.4);opacity:0}
      20%{opacity:.7}
      100%{transform:translateY(-110vh) scale(1.3);opacity:0}
    }

    @keyframes contentEntry{
      from{opacity:0;transform:translateY(25px)}
      to{opacity:1;transform:translateY(0)}
    }

    @keyframes logoFloat{
      0%,100%{transform:translateY(0)}
      50%{transform:translateY(-9px)}
    }

    @keyframes logoPulse{
      from{transform:scale(.9);opacity:.8}
      to{transform:scale(1.18);opacity:0}
    }

    @keyframes blink{50%{opacity:.35}}

    @keyframes buttonShine{
      0%,35%{left:-120%}
      70%,100%{left:150%}
    }

    @media(max-width:600px){
      .jandeja-page{min-height:100svh;padding:28px 16px}

      .logo{
        width:112px;
        height:112px;
        margin-bottom:23px;
      }

      .label{
        margin-bottom:15px;
        padding:7px 13px;
        font-size:10px;
        letter-spacing:1.1px;
      }

      h1{
        font-size:clamp(38px,13vw,58px);
        line-height:1.02;
        letter-spacing:-2px;
      }

      .description{
        margin:16px auto 25px;
        font-size:14px;
        line-height:1.65;
      }

      .telegram-btn{
        width:100%;
        max-width:320px;
        min-width:0;
        padding:16px 22px;
        font-size:13px;
      }

      .brand{margin-top:43px}
      .grid{background-size:42px 42px}
    }

    @media(max-height:650px){
      .jandeja-page{padding-top:16px;padding-bottom:16px}
      .logo{width:96px;height:96px;margin-bottom:17px}
      .description{margin-top:13px;margin-bottom:20px}
      .brand{margin-top:28px}
    }

    @media(prefers-reduced-motion:reduce){
      *,*::before,*::after{
        animation-duration:.01ms!important;
        animation-iteration-count:1!important;
      }
    }
  </style>
</head>

<body>
  <main class="jandeja-page">
    <div class="live-light red"></div>
    <div class="live-light blue"></div>
    <div class="grid"></div>

    <span class="particle p1"></span>
    <span class="particle p2"></span>
    <span class="particle p3"></span>
    <span class="particle p4"></span>

    <div class="content">
      <div class="logo" aria-label="Earn With Jandeja logo">
        <img
          src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&amp;fit=crop&amp;w=600&amp;q=88"
          alt="Earn With Jandeja profile">
        <span class="online-dot"></span>
      </div>

      <div class="label">
        <span class="label-dot"></span>
        Official Community
      </div>

      <h1>
        Earn With
        <span>Jandeja</span>
      </h1>

      <p class="description">
        Join our community to receive the latest updates, useful content
        and important announcements directly on Telegram.
      </p>

      <a
        class="telegram-btn"
        href="https://t.me/+nSoQ_FUlmz80YzM1"
        target="_blank"
        rel="noopener noreferrer">

        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <path d="M21.8 2.2c-.3-.2-.7-.3-1.1-.1L2.1 9.3c-.7.3-.8 1.2-.1 1.6l4.7 2.3 1.8 5.6c.2.7 1.1.9 1.6.4l2.6-2.5 4.8 3.5c.6.4 1.4.1 1.5-.6l3.1-16.4c.1-.4 0-.8-.3-1ZM9.3 13.5l8.4-7.4-6.5 8.3-.5 2.5-1.4-3.4Z"/>
        </svg>

        <span>Join Telegram Channel</span>
      </a>

      <div class="brand">
        Designed by <strong>FLOX ADS</strong>
      </div>
    </div>
  </main>
</body>
